name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 再公開する公開済み正式 tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$REQUESTED_TAG^{commit}" origin/main
          if [[ "$EVENT" == workflow_dispatch ]]; then
            gh release view "$REQUESTED_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("正式公開済み Release が必要です") else . end'
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}
    permissions:
      contents: read
  release:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Metadata and release
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          node scripts/release-metadata.mjs "$TAG"
          test -z "$(git status --porcelain)"
          if [[ "$EVENT" != workflow_dispatch ]]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/lab-release-notes.md
          fi
  deploy:
    needs: [validate, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: dist/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
